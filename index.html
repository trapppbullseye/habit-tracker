<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>habit tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0c0c12;--card:#14141e;--accent:#ff5e7a;--accent2:#ff8a9e;--green:#1a4a3a;--green-lt:#5cb885;--text:#eee;--muted:#5a5a72;--border:#20203a;--row-alt:#10101a}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);padding:24px;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto}

/* ── HEADER ── */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.top h1{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--muted)}
.top .nav{display:flex;align-items:center;gap:12px}
.top .nav .m{font-size:20px;font-weight:700;min-width:130px;text-align:center}
.top .nav button{background:var(--card);border:1px solid var(--border);color:var(--text);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;transition:.15s}
.top .nav button:hover{border-color:var(--accent)}

/* ── STATS BAR ── */
.stats{display:flex;gap:10px;margin-bottom:24px}
.stats .s{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.stats .s .icon{font-size:20px;width:36px;height:36px;background:var(--bg);border-radius:8px;display:grid;place-items:center}
.stats .s .info{display:flex;flex-direction:column}
.stats .s .info .v{font-size:22px;font-weight:800;color:var(--accent2);line-height:1}
.stats .s .info .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}

/* ── ADD FORM ── */
.add{display:flex;gap:8px;margin-bottom:20px}
.add input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-size:13px;outline:none;font-family:'Inter',sans-serif}
.add input:focus{border-color:var(--accent)}
.add button{background:var(--accent);border:none;border-radius:8px;padding:11px 20px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:.2s}
.add button:hover{background:var(--accent2)}

/* ── SPREADSHEET TABLE ── */
.tbl{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;min-width:700px;font-size:13px}
.tbl th,.tbl td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl th{background:var(--bg);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:12px 10px;position:sticky;top:0;z-index:2}
.tbl td:first-child,.tbl th:first-child{text-align:left;position:sticky;left:0;z-index:3;background:var(--card);padding-left:16px;min-width:150px}
.tbl td:first-child{font-weight:600;display:flex;align-items:center;gap:8px}
.tbl tr:nth-child(even) td{background:var(--row-alt)}
.tbl tr:nth-child(even) td:first-child{background:var(--row-alt)}

/* Day cells */
.day-cell{cursor:pointer;border-radius:6px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;background:var(--bg);border:1px solid var(--border);transition:all .12s;margin:1px}
.day-cell:hover{border-color:var(--accent);transform:scale(1.1)}
.day-cell.done{background:var(--green);border-color:var(--green-lt);color:var(--green-lt)}
.day-cell.today{border-color:var(--accent);border-width:2px}
.day-cell.weekend{opacity:.5}

/* Streak & % */
.str{color:var(--accent2);font-weight:700;font-size:12px}
.pct{color:var(--muted);font-size:11px;font-weight:500}

/* Delete */
.del{cursor:pointer;color:var(--muted);font-size:14px;transition:.15s;opacity:0;background:none;border:none;padding:2px 6px;font-family:'Inter',sans-serif}
.tbl tr:hover .del{opacity:.4}
.del:hover{color:var(--accent)!important;opacity:1!important}

/* Day header row - weekday labels */
th .d-num{font-size:11px;font-weight:700;color:var(--text);display:block;margin-top:2px}
th .d-name{font-size:7px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}

/* Empty */
.empty{text-align:center;padding:60px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">

<div class="top">
  <h1>📋 monthly tracker</h1>
  <div class="nav">
    <button onclick="nav(-1)">‹</button>
    <span class="m" id="monthLbl"></span>
    <button onclick="nav(1)">›</button>
  </div>
</div>

<div class="stats" id="stats">
  <div class="s"><div class="icon">📊</div><div class="info"><span class="v" id="overall">0%</span><span class="l">completed</span></div></div>
  <div class="s"><div class="icon">🔥</div><div class="info"><span class="v" id="streakAvg">0</span><span class="l">avg streak</span></div></div>
  <div class="s"><div class="icon">✅</div><div class="info"><span class="v" id="checkins">0</span><span class="l">check-ins</span></div></div>
  <div class="s"><div class="icon">🏆</div><div class="info"><span class="v" id="bestHabit">—</span><span class="l">best streak</span></div></div>
</div>

<div class="add">
  <input id="input" placeholder="Add a new habit..." autocomplete="off">
  <button onclick="add()">+ Add</button>
</div>

<div id="list"><div class="empty">🎯<br><br>No habits yet — add one above!</div></div>

</div>

<script>
// ─── STATE ───
let data=[];let m=new Date().getMonth();let y=new Date().getFullYear()
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
const DOW=['S','M','T','W','T','F','S']

function load(){try{const d=localStorage.getItem('ht2');if(d)data=JSON.parse(d)}catch(e){}}
function save(){localStorage.setItem('ht2',JSON.stringify(data))}

function dim(y,m){return new Date(y,m+1,0).getDate()}
function ds(y,m,d){return `${y}-${(m+1+'').padStart(2,'0')}-${(d+'').padStart(2,'0')}`}
function td(){const d=new Date();return ds(d.getFullYear(),d.getMonth(),d.getDate())}

function streak(dates){
  if(!dates||!dates.length)return 0
  const s=[...new Set(dates)].sort().reverse();let c=0,ck=new Date();ck.setHours(0,0,0,0)
  for(const d of s){const x=new Date(d);x.setHours(0,0,0,0)
    if(+x===+ck){c++;ck.setDate(ck.getDate()-1)}else if(+x<+ck)break}
  return c
}
function best(dates){
  if(!dates||dates.length<2)return dates?.length||0
  const s=[...new Set(dates)].sort().map(d=>new Date(d).setHours(0,0,0,0))
  let b=1,c=1
  for(let i=1;i<s.length;i++){if((s[i]-s[i-1])/86400000===1){c++;b=Math.max(b,c)}else c=1}
  return b
}

function render(){
  const el=document.getElementById('list')
  document.getElementById('monthLbl').textContent=MON[m]+' '+y
  if(!data.length){el.innerHTML=`<div class="empty">🎯<br><br>No habits yet — add one above!</div>`;stats();return}

  const daysInMonth=dim(y,m),today=td()
  let html='<div class="tbl"><table><thead><tr><th>Habit</th>'
  
  // Day headers
  for(let d=1;d<=daysInMonth;d++){
    const wd=new Date(y,m,d).getDay()
    const isToday=ds(y,m,d)===today
    html+=`<th${isToday?' style="color:var(--accent)"':''}><span class="d-name">${DOW[wd]}</span><span class="d-num">${d}</span></th>`
  }
  html+=`<th>🔥</th><th>%</th><th></th></tr></thead><tbody>`

  let overallPct=0,streaks=[],totalCks=0,bestStreak=0

  for(const h of data){
    const dm=(h.d||[]).filter(d=>{const x=new Date(d);return x.getMonth()===m&&x.getFullYear()===y})
    const pct=daysInMonth>0?dm.length/daysInMonth:0
    const str=streak(h.d||[])
    const bst=best(h.d||[])
    overallPct+=pct;streaks.push(str);totalCks+=dm.length
    if(bst>bestStreak)bestStreak=bst

    html+=`<tr><td><span class="emoji">${h.e||'🎯'}</span> ${h.n}</td>`
    
    for(let d=1;d<=daysInMonth;d++){
      const dds=ds(y,m,d),done=dm.includes(dds),isToday=dds===today,wd=new Date(y,m,d).getDay()
      const isWeekend=wd===0||wd===6
      html+=`<td><div class="day-cell${done?' done':''}${isToday?' today':''}" onclick="tog(${data.indexOf(h)},'${dds}')"></div></td>`
    }

    html+=`<td><span class="str">${str>0?'🔥'+str:'—'}</span></td>`
    html+=`<td><span class="pct">${Math.round(pct*100)}%</span></td>`
    html+=`<td><button class="del" onclick="del(${data.indexOf(h)})">✕</button></td>`
    html+=`</tr>`
  }

  html+='</tbody></table></div>'
  el.innerHTML=html;stats(overallPct,streaks,totalCks,bestStreak)
}

function stats(o,s,cks,b){
  const n=data.length||1
  document.getElementById('overall').textContent=Math.round(o/n*100)+'%'
  document.getElementById('streakAvg').textContent=s?.length?Math.round(s.reduce((a,b)=>a+b,0)/s.length):0
  document.getElementById('checkins').textContent=cks||0
  document.getElementById('bestHabit').textContent=b||'—'
}

function add(){
  const i=document.getElementById('input'),v=i.value.trim()
  if(!v)return
  const emojis=['🎯','💪','📖','🧠','🥦','💧','📝','🧘','🌙','🚶','⚡','🎨','🔥','⭐','🎵','🌅','🎮','📸','🎧','✍️','🏃','🎸','🧪','🌱']
  data.push({n:v,d:[],e:emojis[data.length%emojis.length]})
  i.value='';save();render()
}
function del(i){data.splice(i,1);save();render()}
function tog(i,d){const h=data[i];if(!h.d)h.d=[]
  const j=h.d.indexOf(d);j>-1?h.d.splice(j,1):h.d.push(d);save();render()}
function nav(d){m+=d;if(m>11){m=0;y++}if(m<0){m=11;y--};render()}

load();render()
</script>
</body>
</html>
