<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>habit tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:#12121e;--accent:#e94560;--accent2:#ff6b6b;--green:#1b4d38;--green-lt:#6bc99b;--text:#eef0f2;--muted:#555570;--border:#1e1e2e}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);padding:0;min-height:100vh;overflow-x:hidden}
.container{max-width:900px;margin:0 auto;padding:32px 24px}

/* Header */
h1{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--muted);text-align:center;margin-bottom:24px}
.month-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
.month-row .m{font-size:20px;font-weight:700}
.month-row .nav{display:flex;gap:4px}
.month-row .nav button{background:var(--card);border:none;color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;transition:.2s}
.month-row .nav button:hover{color:var(--text);background:var(--border)}

/* Stats row */
.stats{display:flex;gap:8px;margin-bottom:28px}
.stat{flex:1;background:var(--card);border-radius:12px;padding:12px;text-align:center}
.stat .v{font-size:18px;font-weight:800;color:var(--accent2)}
.stat .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px}

/* Form */
.add-row{display:flex;gap:6px;margin-bottom:20px}
.add-row input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:13px;outline:none;font-family:'Inter',sans-serif}
.add-row input:focus{border-color:var(--accent)}
.add-row button{background:var(--accent);border:none;border-radius:8px;padding:10px 16px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
.add-row button:hover{background:var(--accent2)}

/* Habit block */
.habit{background:var(--card);border-radius:12px;padding:14px 14px 12px;margin-bottom:8px;border:1px solid var(--border)}
.habit-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.habit-left{display:flex;align-items:center;gap:8px}
.habit-emoji{font-size:15px;width:20px;text-align:center}
.habit-name{font-size:13px;font-weight:600}
.habit-right{display:flex;align-items:center;gap:8px}
.habit-streak{font-size:11px;color:var(--accent2);font-weight:700}
.habit-pct{font-size:10px;color:var(--muted)}
.habit-del{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:2px 4px;opacity:0;transition:.2s}
.habit:hover .habit-del{opacity:.5}
.habit-del:hover{color:var(--accent);opacity:1!important}

/* Chain grid - the Instagram look */
.chain{display:grid;grid-template-columns:repeat(31,1fr);gap:4px;overflow-x:auto;padding-bottom:4px}
.days-row{display:grid;grid-template-columns:repeat(31,1fr);gap:4px;margin-bottom:2px;overflow-x:auto}
.day-hdr{text-align:center;font-size:8px;font-weight:600;color:var(--muted);padding:2px 0}
.day-hdr.today{color:var(--accent);font-weight:700}
.dot{aspect-ratio:1;border-radius:6px;background:var(--bg);border:1.5px solid var(--border);cursor:pointer;transition:all .15s;min-height:36px;position:relative;width:100%;min-width:24px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:var(--muted)}
.dot:hover{transform:scale(1.15);border-color:var(--accent)}
.dot.done{background:var(--green);border-color:var(--green-lt)}
.dot.today{border-color:var(--accent);border-width:2px}
.dot.today.done{border-color:var(--green-lt);border-width:2px}
.dot-label{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:6px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;pointer-events:none}

/* Bullet proof - also looks good */
.bullet-row{display:flex;align-items:center;gap:6px;margin-top:12px;padding-top:8px;border-top:1px solid var(--border)}
.bullet{width:22px;height:22px;border-radius:50%;background:var(--bg);border:1.5px solid var(--border);cursor:pointer;transition:.15s;flex-shrink:0}
.bullet.done{background:var(--green);border-color:var(--green-lt)}
.bullet:hover{transform:scale(1.2);border-color:var(--accent)}
.bullet-label{font-size:8px;color:var(--muted);min-width:18px;text-align:center}

.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}
.empty .big{font-size:40px;margin-bottom:12px}
</style>
</head>
<body>
<div class="container">

<h1>📋 monthly tracker</h1>

<div class="month-row">
  <div class="m" id="monthLabel"></div>
  <div class="nav">
    <button onclick="nav(-1)">‹</button>
    <button onclick="nav(1)">›</button>
  </div>
</div>

<div class="stats" id="stats">
  <div class="stat"><div class="v" id="overall">0%</div><div class="l">done</div></div>
  <div class="stat"><div class="v" id="streakAvg">0</div><div class="l">avg streak</div></div>
  <div class="stat"><div class="v" id="checkins">0</div><div class="l">check-ins</div></div>
</div>

<div class="add-row">
  <input id="input" placeholder="add habit..." autocomplete="off">
  <button onclick="add()">+</button>
</div>

<div id="list"></div>

<div class="empty" id="empty">
  <div class="big">🎯</div>
  <p>no habits yet</p>
</div>

</div>

<script>
// ─── STATE ───
let data = [];
let m = new Date().getMonth();
let y = new Date().getFullYear();
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['S','M','T','W','T','F','S'];

function load(){try{const d=localStorage.getItem('ht');if(d)data=JSON.parse(d)}catch(e){}}
function save(){localStorage.setItem('ht',JSON.stringify(data))}

function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}
function dateStr(y,m,d){return y+'-'+(m+1+'').padStart(2,'0')+'-'+(d+'').padStart(2,'0')}
function todayStr(){const d=new Date();return dateStr(d.getFullYear(),d.getMonth(),d.getDate())}

function streak(dates){
  if(!dates||!dates.length)return 0
  let s=[...new Set(dates)].sort().reverse(),c=0,t=new Date();t.setHours(0,0,0,0)
  for(const d of s){const x=new Date(d);x.setHours(0,0,0,0)
    if(+x===+t){c++;t.setDate(t.getDate()-1)}else if(+x<+t)break}
  return c
}

function render(){
  const el=document.getElementById('list'),em=document.getElementById('empty')
  document.getElementById('monthLabel').textContent=MON[m]+' '+y
  
  if(!data.length){el.innerHTML='';em.style.display='block'
    document.getElementById('overall').textContent='0%'
    document.getElementById('streakAvg').textContent='0'
    document.getElementById('checkins').textContent='0'
    return}
  em.style.display='none'

  const dim=daysInMonth(y,m),today=todayStr()
  let h='',ttl=0,strs=[],cks=0

  for(const hh of data){
    const dm=(hh.d||[]).filter(d=>{const x=new Date(d);return x.getMonth()===m&&x.getFullYear()===y})
    const pct=dim>0?dm.length/dim:0
    const str=streak(hh.d||[])
    ttl+=pct;strs.push(str);cks+=dm.length

    // Chain dots
        let daysHeader=''
        for(let d=1;d<=dim;d++){
          const isToday=dateStr(y,m,d)===today
          daysHeader+=`<div class="day-hdr${isToday?' today':''}">${d}</div>`
        }

        let dots=''
        for(let d=1;d<=dim;d++){
          const ds=dateStr(y,m,d),done=dm.includes(ds),is=ds===today
          dots+=`<div class="dot${done?' done':''}${is?' today':''}" onclick="tog(${data.indexOf(hh)},'${ds}')"></div>`
        }

        h+=`<div class="habit">
          <div class="habit-top">
            <div class="habit-left">
              <span class="habit-emoji">${hh.e||'🎯'}</span>
              <span class="habit-name">${hh.n}</span>
            </div>
            <div class="habit-right">
              <span class="habit-streak">${str>0?'🔥 '+str:''}</span>
              <span class="habit-pct">${Math.round(pct*100)}%</span>
              <span class="habit-del" onclick="del(${data.indexOf(hh)})">✕</span>
            </div>
          </div>
          <div class="days-row">${daysHeader}</div>
          <div class="chain">${dots}</div>
        </div>`
  }

  el.innerHTML=h
  const avg=data.length||1
  document.getElementById('overall').textContent=Math.round(ttl/avg*100)+'%'
  document.getElementById('streakAvg').textContent=strs.length?Math.round(strs.reduce((a,b)=>a+b,0)/strs.length):0
  document.getElementById('checkins').textContent=cks
}

function add(){
  const i=document.getElementById('input'),v=i.value.trim()
  if(!v)return
  const emojis=['🎯','💪','📖','🧠','🥦','💧','📝','🧘','🌙','🚶','⚡','🎨','🔥','⭐','🎵','🌅','🎮','📸','🎧','✍️']
  data.push({n:v,d:[],e:emojis[data.length%emojis.length]})
  i.value='';save();render()
}

function del(i){data.splice(i,1);save();render()}
function tog(i,ds){const h=data[i];if(!h.d)h.d=[]
  const j=h.d.indexOf(ds);j>-1?h.d.splice(j,1):h.d.push(ds);save();render()}
function nav(d){m+=d;if(m>11){m=0;y++}if(m<0){m=11;y--};render()}

load();render()
</script>
</body>
</html>
