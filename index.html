<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Habit Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:#1a1a2e;--card2:#1f1f35;--accent:#e94560;--accent2:#ff6b6b;--green:#2d6a4f;--green-lt:#8fbc8f;--text:#e0e0e0;--muted:#6b6b80;--border:#2a2a3e;--radius:14px;--shadow:0 8px 32px rgba(0,0,0,.4)}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0;overflow-x:hidden}
.container{max-width:800px;margin:0 auto;padding:20px 16px}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-top:8px}
h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px}
.month-nav{display:flex;align-items:center;gap:12px}
.month-nav button{background:var(--card);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px;transition:.2s}
.month-nav button:hover{background:var(--card2);border-color:var(--accent)}
.month-label{font-size:18px;font-weight:700;color:var(--text);min-width:140px;text-align:center}

/* Stats bar */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:24px}
.stat{background:var(--card);border-radius:var(--radius);padding:14px 12px;text-align:center;border:1px solid var(--border)}
.stat .val{font-size:22px;font-weight:800;color:var(--accent2);margin-bottom:2px}
.stat .lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat .sub{font-size:10px;color:var(--muted);margin-top:1px}

/* Add habit */
.add-form{display:flex;gap:8px;margin-bottom:20px}
.add-form input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-size:15px;font-family:'Inter',sans-serif;outline:none;transition:.2s}
.add-form input:focus{border-color:var(--accent)}
.add-form button{background:var(--accent);border:none;border-radius:10px;padding:12px 20px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;font-family:'Inter',sans-serif;white-space:nowrap}
.add-form button:hover{background:var(--accent2)}

/* Habit card */
.habit{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:10px;border:1px solid var(--border);transition:.2s}
.habit:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.habit-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.habit-name{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.habit-name .emoji{font-size:18px}
.habit-stats{display:flex;gap:14px;align-items:center}
.habit-stats span{font-size:13px;font-weight:600}
.streak{color:var(--accent2)}
.pct{color:var(--green-lt)}
.best{border:9px; font-weight:400}

/* Progress bar bg */
.progress-wrap{height:6px;background:var(--bg);border-radius:4px;margin-bottom:10px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s ease;width:0%}

/* Day grid */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.day{aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:all .15s;font-size:10px;color:var(--muted);position:relative;min-height:36px;text-decoration:none}
.day:hover{border-color:var(--accent);transform:scale(1.05)}
.day.done{background:var(--green);border-color:var(--green);color:var(--green-lt)}
.day.done .dnum{color:#fff;font-weight:700}
.day.today{border-color:var(--accent);border-width:2px}
.day.weekend{background:rgba(255,255,255,.03)}
.day.weekend.done{background:var(--green)}
.dnum{font-size:12px;font-weight:600;line-height:1}
.dname{font-size:7px;text-transform:uppercase;opacity:.5;margin-top:1px}

/* Delete */
.delete-btn{background:none;border:1px solid rgba(233,69,96,.3);color:var(--accent);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:600;transition:.2s;font-family:'Inter',sans-serif;opacity:.5}
.delete-btn:hover{background:rgba(233,69,96,.15);opacity:1}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-size:48px;margin-bottom:12px}
.empty p{font-size:15px}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--text);padding:12px 24px;border-radius:10px;border:1px solid var(--border);font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:100}
.toast.show{opacity:1}

@media(max-width:500px){.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:22px}.month-label{min-width:100px;font-size:15px}}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>📋 Tracker</h1>
    <div class="month-nav">
      <button onclick="navMonth(-1)">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button onclick="navMonth(1)">›</button>
    </div>
  </header>

  <!-- Stats -->
  <div class="stats" id="stats">
    <div class="stat"><div class="val" id="overallPct">0%</div><div class="lbl">Overall</div><div class="sub">completion</div></div>
    <div class="stat"><div class="val" id="avgStreak">0</div><div class="lbl">Avg Streak</div><div class="sub">days</div></div>
    <div class="stat"><div class="val" id="bestHabit">—</div><div class="lbl">Best Habit</div><div class="sub">🔥 streak</div></div>
    <div class="stat"><div class="val" id="totalCheckins">0</div><div class="lbl">Check-ins</div><div class="sub">this month</div></div>
  </div>

  <!-- Add form -->
  <form class="add-form" onsubmit="addHabit(event)">
    <input type="text" id="habitInput" placeholder="New habit..." required autocomplete="off">
    <button type="submit">+ Add</button>
  </form>

  <!-- Habit list -->
  <div id="habitList"></div>

  <!-- Empty state -->
  <div class="empty" id="emptyState">
    <div class="big">🎯</div>
    <p>No habits yet. Add your first one above!</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── STATE ───
let habits = [];
let currentDate = new Date();
let currentMonth = currentDate.getMonth();
let currentYear = currentDate.getFullYear();

const DAYS = ['S','M','T','W','T','F','S'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// ─── STORAGE ───
function load(){try{const d=localStorage.getItem('ht_habits');if(d)habits=JSON.parse(d)}catch(e){}}
function save(){localStorage.setItem('ht_habits',JSON.stringify(habits))}

// ─── STREAK CALC ───
function calcStreak(dates){
  if(!dates||!dates.length)return 0;
  const sorted=[...new Set(dates)].sort().reverse();
  let streak=0, check=new Date();
  check.setHours(0,0,0,0);
  for(const d of sorted){
    const dd=new Date(d);dd.setHours(0,0,0,0);
    if(+dd===+check){streak++;check.setDate(check.getDate()-1)}
    else if(+dd<+check)break;
  }
  return streak;
}

function calcBestStreak(dates){
  if(!dates||dates.length<2)return dates?.length||0;
  const sorted=[...new Set(dates)].sort().map(d=>new Date(d).setHours(0,0,0,0));
  let best=1,cur=1;
  for(let i=1;i<sorted.length;i++){
    const diff=(sorted[i]-sorted[i-1])/86400000;
    if(diff===1){cur++;best=Math.max(best,cur)}else cur=1;
  }
  return best;
}

// ─── UI ───
function getDaysInMonth(y,m){return new Date(y,m+1,0).getDate()}
function getFirstDay(y,m){return new Date(y,m,1).getDay()}
function dateStr(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}

function render(){
  const el=document.getElementById('habitList');
  const empty=document.getElementById('emptyState');
  const monthLabel=document.getElementById('monthLabel');
  
  monthLabel.textContent=`${MONTHS[currentMonth]} ${currentYear}`;
  
  if(!habits.length){
    el.innerHTML='';empty.style.display='block';
    document.getElementById('overallPct').textContent='0%';
    document.getElementById('avgStreak').textContent='0';
    document.getElementById('bestHabit').textContent='—';
    document.getElementById('totalCheckins').textContent='0';
    return;
  }
  empty.style.display='none';

  const daysInMonth=getDaysInMonth(currentYear,currentMonth);
  const firstDay=getFirstDay(currentYear,currentMonth);
  const today=new Date();today.setHours(0,0,0,0);
  const todayStr=dateStr(today.getFullYear(),today.getMonth(),today.getDate());

  let html='';
  let totalPct=0, totalStreaks=[], totalCheckins=0, maxStreak=0, bestHabitName='';

  for(const h of habits){
    const datesInMonth=(h.dates||[]).filter(d=>{
      const dd=new Date(d);
      return dd.getMonth()===currentMonth&&dd.getFullYear()===currentYear;
    });
    const streak=calcStreak(h.dates||[]);
    const best=calcBestStreak(h.dates||[]);
    const pct=daysInMonth>0?datesInMonth.length/daysInMonth:0;
    totalPct+=pct;
    totalStreaks.push(streak);
    totalCheckins+=datesInMonth.length;
    if(streak>maxStreak){maxStreak=streak;bestHabitName=h.name}

    const daysHtml=[];
    for(let d=1;d<=daysInMonth;d++){
      const ds=dateStr(currentYear,currentMonth,d);
      const done=datesInMonth.includes(ds);
      const isToday=ds===todayStr;
      const wd=new Date(currentYear,currentMonth,d).getDay();
      const isWeekend=wd===0||wd===6;
      daysHtml.push(`<a class="day${done?' done':''}${isToday?' today':''}${isWeekend&&!done?' weekend':''}" href="#" onclick="toggleDay(${habits.indexOf(h)},'${ds}');return false" title="${ds}">
        <span class="dname">${DAYS[wd]}</span>
        <span class="dnum">${d}</span>
      </a>`);
    }

    html+=`<div class="habit">
      <div class="habit-header">
        <div class="habit-name"><span class="emoji">${h.emoji||'🎯'}</span>${h.name}</div>
        <div class="habit-stats">
          <span class="streak">🔥 ${streak}</span>
          <span class="pct">${Math.round(pct*100)}%</span>
          <button class="delete-btn" onclick="deleteHabit(${habits.indexOf(h)})">Delete</button>
        </div>
      </div>
      <div class="progress-wrap"><div class="progress-fill" style="width:${Math.round(pct*100)}%"></div></div>
      <div class="days">${daysHtml.join('')}</div>
    </div>`;
  }

  el.innerHTML=html;

  // Stats
  const avgHabits=habits.length||1;
  document.getElementById('overallPct').textContent=`${Math.round(totalPct/avgHabits*100)}%`;
  document.getElementById('avgStreak').textContent=totalStreaks.length?Math.round(totalStreaks.reduce((a,b)=>a+b,0)/totalStreaks.length):0;
  document.getElementById('bestHabit').textContent=maxStreak>0?`${maxStreak}`:'—';
  document.getElementById('totalCheckins').textContent=totalCheckins;
}

// ─── ACTIONS ───
function addHabit(e){
  e.preventDefault();
  const input=document.getElementById('habitInput');
  const name=input.value.trim();
  if(!name)return;
  const emojis=['🎯','💪','📖','🧠','🥦','💧','📝','🧘','🌙','🚶','⚡','🎨','🔥','⭐','🎵','🌅'];
  habits.push({name,dates:[],emoji:emojis[habits.length%emojis.length]});
  input.value='';
  save();render();showToast(`✨ "${name}" added!`);
}

function deleteHabit(idx){
  if(!confirm('Delete this habit?'))return;
  const name=habits[idx].name;
  habits.splice(idx,1);
  save();render();showToast(`🗑️ "${name}" deleted`);
}

function toggleDay(idx,ds){
  const h=habits[idx];
  if(!h.dates)h.dates=[];
  const i=h.dates.indexOf(ds);
  if(i>-1)h.dates.splice(i,1);
  else h.dates.push(ds);
  save();render();
}

function navMonth(dir){
  currentMonth+=dir;
  if(currentMonth>11){currentMonth=0;currentYear++}
  if(currentMonth<0){currentMonth=11;currentYear--}
  render();
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

// ─── INIT ───
load();render();
</script>
</body>
</html>
